<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>합성 도서관 운영 연구 — 기획보고서</title>
<style>
  :root { --bg: #fbfbf8; --fg: #1f2328; --muted: #646b73; --line: #dcdcd4; --accent: #24589e; --chip: #efefe9; --ok: #2e7d4f; --warn: #a86b12; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --fg: #e6e6e6; --muted: #9aa0a6; --line: #33373d; --accent: #7aa7ff; --chip: #262a30; --ok: #5fcf8f; --warn: #e0a84a; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.75 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
  nav.toc { position: sticky; top: 20px; align-self: start; font-size: 13px; max-height: calc(100vh - 40px); overflow: auto; }
  nav.toc a { display: block; color: var(--muted); text-decoration: none; padding: 2px 0; } nav.toc a:hover { color: var(--accent); }
  nav.toc a.l3 { padding-left: 12px; } nav.toc a.l4 { padding-left: 24px; font-size: 12px; }
  article { min-width: 0; max-width: 820px; }
  .kicker { color: var(--accent); font-weight: 700; letter-spacing: .02em; }
  h1 { font-size: 24px; line-height: 1.3; margin: 4px 0 12px; text-wrap: balance; }
  h2 { font-size: 19px; margin: 40px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
  h3 { font-size: 16px; margin: 28px 0 8px; color: var(--accent); }
  h4 { font-size: 14.5px; margin: 22px 0 6px; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0 16px; font-size: 13.5px; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  th { background: var(--chip); }
  code { background: var(--chip); padding: 0 4px; border-radius: 3px; font-size: 90%; }
  a { color: var(--accent); word-break: break-all; }
  .ok { color: var(--ok); font-weight: 600; } .no { color: var(--warn); }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 20px; }
  .bar a, .bar button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg); text-decoration: none; cursor: pointer; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } nav.toc { position: static; max-height: none; } }
  @media print { nav.toc, .bar { display: none; } .wrap { display: block; padding: 0; } body { background: #fff; color: #000; font-size: 11pt; } h2 { break-after: avoid; } table { display: table; } }

:root { --bg:#f3f5f7; --fg:#202c3c; --muted:#5f6f80; --card:#fff; --line:#d7dfe7; --accent:#245e9e; --ok:#317057; --warn:#98681b; --bad:#ad3e3e; --chip:#edf1f5; --soft:#f7f9fb; }
@media(prefers-color-scheme:dark){:root{--bg:#131b25;--fg:#e3eaf2;--muted:#a8b6c5;--card:#1c2735;--line:#39495d;--accent:#92bffe;--ok:#8bd5af;--warn:#f0c276;--bad:#ffaaa4;--chip:#293747;--soft:#212e3d;color-scheme:dark;}}
.globalbar { max-width:1296px; margin:0 auto; padding:32px 0 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; color:var(--fg); font:700 21px/1.4 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; letter-spacing:.08em; }
.globalbar span{font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:1360px){.globalbar{margin:0 32px}}@media(max-width:600px){.globalbar{margin:0 16px;padding-top:20px}}

body{background:var(--bg);color:var(--fg);font:14.5px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}.wrap{max-width:1296px;grid-template-columns:240px minmax(0,1fr);gap:32px;padding:32px 24px 80px}nav.toc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:13px;top:24px}nav.toc b{display:block;margin-bottom:8px}nav.toc a{padding:4px 0}article{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:32px;max-width:920px}.bar{gap:8px;margin:0 0 32px}.bar a,.bar button{border-radius:5px;padding:8px 12px;background:var(--card)}.kicker{font-size:13px}h1{font-size:24px;margin:4px 0 16px}h2{margin:48px 0 16px;border-color:var(--line);padding-bottom:12px}h3{margin:32px 0 12px}h4{margin:24px 0 8px}p{margin:8px 0 16px}table{margin:16px 0 24px;font-size:13.5px}th,td{padding:8px 12px}th{background:var(--soft)}
@media(max-width:860px){.wrap{display:block;padding:24px 16px 64px}nav.toc{position:static;max-height:240px;margin-bottom:24px}article{padding:24px}}@media print{.globalbar{display:none}article{border:0;padding:0}.wrap{padding:0}nav.toc,.bar{display:none}body{background:#fff;color:#000}}

/* ---- 인쇄 (A4) ---- */
@page { size: A4; margin: 18mm 16mm 20mm; @bottom-center { content: counter(page) " / " counter(pages); font-size: 9pt; color: #666; } }
@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
  figure, img, svg, blockquote { break-inside: avoid; } tr { break-inside: avoid; } thead { display: table-header-group; }
  h1, h2, h3, h4 { break-after: avoid; }
  p, li { orphans: 3; widows: 3; }
}
@media print {
  .wrap, article { max-width: none; } article { font-size: 10.5pt; line-height: 1.7; }
  .kicker { color: #24589e !important; } h2 { break-before: auto; border-bottom: 1.5pt solid #000; }
  article a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 8pt; color: #555; word-break: break-all; }
  .printmeta { display: block !important; font-size: 9pt; color: #555; margin: 0 0 12pt; }
}
.printmeta { display: none; }
</style>
</head>
<body>
<div class="globalbar"><b>PES</b><span>프로젝트 실행 시스템</span></div>
<div class="wrap"><nav class="toc" id="toc" aria-label="목차"></nav><article id="doc"></article></div>
<script id="data" type="application/json">{"title": "합성 도서관 운영 연구 — 기획보고서", "stage": "plan", "label": "기획", "name": "기획보고서", "md": "# 합성 도서관 운영 연구 — 기획보고서\n\n- 단계: 기획 · 라운드 1회 · 승인 2026-01-05 12:00\n- 항목 2개 · 출처 1개 (원문 확인 0개)\n- 작성 2001-01-01 00:00 · PES\n\n## 1. 요약\n\n합성 기획 요약\n\n## 3. 결과\n\n### 3.1 연구 질문 (1)\n\n#### #1 합성 항목 하나\n\n- 신뢰도 high · R1 갱신\n- 근거 출처: [1·미확인] [1·미확인] (아래 「출처」 번호, 원문 확인 0/2)\n\n합성 요약 1\n\n합성 본문 1\n\n### 3.2 alien (1)\n\n#### #2 합성 항목 둘\n\n- 근거 출처: 없음 ⚠ — 이 항목의 내용은 출처로 뒷받침되지 않았다\n\n## 4. 라운드 경과와 사용자 결정\n\n- R1 (2026-01-05 10:00): 합성 변경 — 상세 snapshots/plan-R1.json\n- R1 approve: 합성 승인\n\n## 4-1. 남은 일 — 다음 단계로 넘김\n\n승인 때 끝내지 못한 할 일이다. 다음 단계 첫 라운드에서 먼저 처리한다.\n\n- #1 합성 항목 하나: 다음 단계에서 표를 보강한다\n- #2 합성 항목 둘: 대상을 알 수 없는 남은 일\n\n## 5. 출처\n\n1. 합성 출처 A — https://example.invalid/a (2025-12-01) [미확인]\n\n", "built": "2001-01-01 00:00", "round": 1, "approved_at": "2026-01-05 12:00"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent) || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  .replace(/\[확인됨\]/g, '<span class="ok">[확인됨]</span>').replace(/\[미확인\]/g, '<span class="no">[미확인]</span>');
const toc = []; let hid = 0;
function md(src) {
  const lines = String(src || '').split('\n'); let out = '', list = null, para = [];
  const fP = () => { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const fL = () => { if (list) { out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i]; let m;
    if (/^\s*\|.*\|\s*$/.test(l)) {
      fP(); fL(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]); i--;
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += '<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('') + '</tr>').join('') + '</table>';
    } else if ((m = l.match(/^(#{1,4})\s+(.*)/))) {
      fP(); fL(); const n = m[1].length;
      if (n === 1) { out += `<div class="kicker">${esc(D.label)} 단계 · ${esc(D.name)}</div><h1>${inline(m[2])}</h1>`; continue; }
      const id = 'h' + (++hid); toc.push({ n, id, t: m[2] }); out += `<h${n} id="${id}">${inline(m[2])}</h${n}>`;
    } else if ((m = l.match(/^\s*[-*□○]\s+(.*)/))) { fP(); if (list !== 'ul') { fL(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { fP(); if (list !== 'ol') { fL(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) { fP(); fL(); }
    else { fL(); para.push(l.trim()); }
  }
  fP(); fL(); return out;
}
const body = md(D.md);
document.getElementById('doc').innerHTML = `<div class="bar"><a href="../../index.html#${esc(D.stage)}">← 대시보드</a><a href="report.md">마크다운</a><a href="eli5.html">그림 설명(eli5)</a><button onclick="print()">인쇄·PDF</button></div><div class="printmeta">${esc(D.label)} 단계 · ${esc(D.name)} · R${esc(D.round)}${D.approved_at ? ' · 승인 ' + esc(D.approved_at) : ''} · 출력 ${new Date().toLocaleDateString('ko-KR')}</div>` + body;
document.getElementById('toc').innerHTML = '<b>목차</b>' + toc.map(h => `<a class="l${h.n}" href="#${h.id}">${inline(h.t)}</a>`).join('');

// ?print=1 로 열면 그린 뒤 바로 인쇄 창을 띄운다 (대시보드의 '인쇄' 링크)
if (/[?&]print=1/.test(location.search)) addEventListener('load', () => setTimeout(() => print(), 300));
</script>
</body>
</html>
