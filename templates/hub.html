<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#f7f7f4; --fg:#1f2328; --muted:#6a737d; --card:#fff; --line:#e2e2dc; --accent:#2f6fde; --warn:#b7791f; --ok:#2e8b57; --bad:#c0392b; --chip:#efefea; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --card:#1f2227; --line:#33373d; --accent:#6ea0ff; --warn:#e0a84a; --ok:#5fcf8f; --bad:#ff7a6b; --chip:#2a2e34; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
main { max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
h1 { font-size:24px; margin:0; } .meta { color:var(--muted); font-size:13px; }
.top { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; }
.kpis { display:flex; gap:10px; margin:16px 0; flex-wrap:wrap; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; width:180px; }
.kpi b { display:block; font-size:20px; } .kpi span { font-size:12px; color:var(--muted); }
.tabs { display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap; }
.tabs button { font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
.tabs button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.new { font-size:13px; color:var(--muted); } code { background:var(--chip); padding:2px 8px; border-radius:6px; color:var(--fg); }
.grid { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.head, .row { display:grid; grid-template-columns: minmax(0,1.6fr) 250px 140px minmax(0,1.3fr) 120px 130px; gap:14px; align-items:center; padding:12px 16px; }
.head { font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); padding:8px 16px; }
.row { border-bottom:1px solid var(--line); min-height:80px; } .row:last-child { border-bottom:0; }
.row.you { box-shadow: inset 3px 0 0 var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.name b { display:block; font-size:15px; line-height:1.35; } .name small { display:block; color:var(--muted); font-size:12px; }
.name .lock { color:var(--warn); }
.steps { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; }
.steps i { height:8px; border-radius:2px; background:var(--line); }
.steps i.approved { background:var(--ok); } .steps i.active, .steps i.asking { background:var(--accent); } .steps i.stale { background:var(--warn); }
.slab { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; font-size:10px; color:var(--muted); margin-top:3px; }
.stage b { font-size:14px; } .stage small { display:block; color:var(--muted); font-size:12px; }
.todo { font-size:13px; } .who { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; margin-bottom:3px; }
.who.you { background:var(--accent); color:#fff; } .who.ai { background:var(--chip); color:var(--muted); } .who.done { background:var(--ok); color:#fff; } .who.err { background:var(--bad); color:#fff; }
.reps { font-size:12px; color:var(--muted); } .reps b { color:var(--fg); font-size:14px; }
.open a, .open button { display:block; width:100%; text-align:center; font:inherit; font-size:13px; padding:6px 10px; border-radius:8px; text-decoration:none; cursor:pointer; }
.open a { background:var(--accent); color:#fff; font-weight:600; border:0; }
.open button { border:1px solid var(--line); background:var(--card); color:var(--fg); }
.open small { display:block; text-align:center; font-size:11px; color:var(--muted); margin-top:3px; }
.foot { margin-top:14px; font-size:12px; color:var(--muted); }
.empty { padding:40px; text-align:center; color:var(--muted); }
@media (max-width: 900px) { .head { display:none; } .row { grid-template-columns: 1fr 1fr; } .name { grid-column: 1 / -1; } }
</style></head><body><main id="app"></main>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent) || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PS = D.projects || [], STG = D.stages || [];
const WHO = { you: '내 차례', ai: 'Claude 작업 중', done: '완료', err: '오류' };
const RN = { plan: '기획', research: '조사', analyze: '분석·종합', write: '집필', verify: '검증', publish: '산출' };
let F = 'all'; const LIVE = {};
const n = w => PS.filter(p => p.who === w).length;
function row(p) {
  const cur = (p.stages || []).find(s => s.key === p.current) || {};
  const reps = (p.stages || []).filter(s => (s.reports || []).length);
  const live = LIVE[p.slug];
  const open = live ? `<a href="http://127.0.0.1:${live}/" target="_blank">열기</a><small>:${live} · 서버 켜짐</small>`
    : `<button data-start="${esc(p.slug)}">서버 켜고 열기</button><small>서버 꺼짐</small>`;
  return `<div class="row ${esc(p.who)}">
    <div class="name"><b>${esc(p.topic)}</b><small>${esc(p.slug)} · 시작 ${esc(String(p.created || '').slice(5))} · 갱신 ${esc(String(p.updated || '').slice(5))}</small>${p.lock ? `<small class="lock">Claude 세션이 사용 중 (${esc(p.lock.owner)}…, ${esc(String(p.lock.since || '').slice(5))}부터)</small>` : ''}</div>
    <div><div class="steps">${(p.stages || []).map(s => `<i class="${esc(s.stale ? 'stale' : s.status)}" title="${esc(s.label)}: ${esc(s.status)}${s.round ? ' R' + s.round : ''}"></i>`).join('')}</div><div class="slab">${STG.map(s => `<span>${esc(RN[s.key] || s.label)}</span>`).join('')}</div></div>
    <div class="stage"><b>${p.complete ? '완료' : esc(cur.label || '-')}</b><small>${p.complete ? '6단계 모두 승인' : `${esc({ pending: '대기', asking: '시작 질문 중', active: '진행 중', approved: '승인됨' }[cur.status] || cur.status || '')}${cur.round ? ' · R' + cur.round : ''}`}</small></div>
    <div class="todo"><span class="who ${esc(p.who)}">${esc(WHO[p.who] || p.who)}</span><br>${esc(p.todo)}</div>
    <div class="reps"><b>${reps.length}</b> / 6<br>${esc(reps.map(s => RN[s.key]).join(' · ') || '아직 없음')}</div>
    <div class="open">${open}</div></div>`;
}
function render() {
  const list = PS.filter(p => F === 'all' || (F === 'run' ? !p.complete : p.who === F));
  const repN = PS.reduce((a, p) => a + (p.stages || []).filter(s => (s.reports || []).length).length, 0);
  document.getElementById('app').innerHTML = `
  <div class="top"><div><h1>PES 프로젝트</h1><div class="meta">${esc(D.root)} · 갱신 ${esc(D.built)}</div></div>
    <div class="new">새 프로젝트: Claude Code에서 <code>/pes:start 주제</code></div></div>
  <div class="kpis">
    <div class="kpi"><b>${PS.length}</b><span>프로젝트 (진행 ${PS.filter(p => !p.complete).length} · 완료 ${n('done')})</span></div>
    <div class="kpi"><b>${n('you')}</b><span>내가 답할 차례인 프로젝트</span></div>
    <div class="kpi"><b>${n('ai')}</b><span>Claude 차례인 프로젝트</span></div>
    <div class="kpi"><b>${repN}</b><span>만들어진 단계 보고서</span></div>
  </div>
  <div class="tabs">${[['all', '전체', PS.length], ['you', '내 차례', n('you')], ['run', '진행 중', PS.filter(p => !p.complete).length], ['done', '완료', n('done')]].map(([k, l, c]) => `<button data-f="${k}" class="${F === k ? 'on' : ''}">${l} ${c}</button>`).join('')}</div>
  <div class="grid"><div class="head"><span>프로젝트</span><span>단계 진행</span><span>현재</span><span>지금 할 일</span><span>단계 보고서</span><span>대시보드</span></div>
    ${list.length ? list.map(row).join('') : '<div class="empty">해당하는 프로젝트가 없습니다.</div>'}</div>
  <div class="foot">막대 색: 초록 = 승인, 파랑 = 진행 중, 주황 = 앞 단계가 바뀌어 다시 확인 필요, 회색 = 대기. '내 차례'가 맨 위로 옵니다.<br>
  'Claude 작업 중'인 프로젝트는 그 프로젝트를 연 Claude Code 세션에서 진행됩니다. 세션이 없으면 <code>/pes:run 폴더</code>로 이어 가세요.</div>`;
}
document.addEventListener('click', async e => {
  const f = e.target.closest('[data-f]'); if (f) { F = f.dataset.f; return render(); }
  const b = e.target.closest('[data-start]'); if (!b) return;
  b.disabled = true; b.textContent = '켜는 중…';
  try {
    const r = await fetch('/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: b.dataset.start }) });
    const j = await r.json();
    if (j.ok) { const port = +(j.url.match(/:(\d+)\//) || [])[1]; LIVE[b.dataset.start] = port; render(); window.open(j.url, '_blank'); }
    else { b.textContent = '실패 — /pes:status 로'; }
  } catch { b.textContent = '실패 — /pes:status 로'; }
});
async function probe() {
  await Promise.all(PS.filter(p => p.port).map(async p => {
    try { const r = await fetch(`http://127.0.0.1:${p.port}/whoami`, { cache: 'no-store' }); const j = await r.json(); if (j.root === p.path) LIVE[p.slug] = p.port; } catch {}
  }));
  render();
}
render(); probe();
</script></body></html>
