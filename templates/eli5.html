<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --paper: #eef1ec; --ink: #1f2a2e; --board: #2d4a3e; --chalk: #f4f1e4;
  --mustard: #e3a92b; --tomato: #d9553b; --muted: #5d6b66;
  --display: "Jua", "Apple SD Gothic Neo", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; display: grid; gap: 56px; }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.1; }
h2 { font-size: clamp(26px, 4vw, 38px); }
.kicker { font-family: var(--display); color: var(--tomato); font-size: 18px; }
.lead { font-size: 20px; color: var(--muted); margin: 10px 0 0; }
section { display: grid; gap: 14px; }
.step { font-family: var(--display); color: var(--tomato); font-size: 18px; }
.say { font-size: 20px; margin: 0; max-width: 34em; }
.pic { background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 2px 0 rgba(31,42,46,.08); overflow-x: auto; }
.pic svg { width: 100%; height: auto; display: block; } .pic svg text { font-family: var(--display); }
.emoji { font-size: clamp(56px, 11vw, 96px); line-height: 1.15; text-align: center; padding: 18px 8px; letter-spacing: .08em; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.map div { background: #fff; border-radius: 14px; padding: 16px; display: grid; gap: 4px; border-top: 6px solid var(--mustard); }
.map .e { font-size: 42px; } .map b { font-family: var(--display); font-weight: 400; font-size: 24px; } .map span { color: var(--muted); }
.end { background: var(--board); color: var(--chalk); border-radius: 18px; padding: 24px; font-family: var(--display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.5; }
.end strong { color: var(--mustard); font-weight: 400; }
dl.words { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 18px; margin: 0; }
dl.words dt { font-family: var(--display); color: var(--board); } dl.words dd { margin: 0; color: var(--muted); }
.back { font-size: 14px; } .back a { color: var(--board); margin-right: 12px; }

:root { --bg:#f3f5f7; --fg:#202c3c; --muted:#5f6f80; --card:#fff; --line:#d7dfe7; --accent:#245e9e; --ok:#317057; --warn:#98681b; --bad:#ad3e3e; --chip:#edf1f5; --soft:#f7f9fb; }
@media(prefers-color-scheme:dark){:root{--bg:#131b25;--fg:#e3eaf2;--muted:#a8b6c5;--card:#1c2735;--line:#39495d;--accent:#92bffe;--ok:#8bd5af;--warn:#f0c276;--bad:#ffaaa4;--chip:#293747;--soft:#212e3d;color-scheme:dark;}}
.globalbar { max-width:1296px; margin:0 auto; padding:32px 0 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; color:var(--fg); font:700 21px/1.4 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; letter-spacing:.08em; }
.globalbar span{font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:1360px){.globalbar{margin:0 32px}}@media(max-width:600px){.globalbar{margin:0 16px;padding-top:20px}}

:root{--paper:var(--bg);--ink:var(--fg);--board:#294a40;--chalk:#f4f1e4;--mustard:#b77b16;--tomato:#245e9e;--display:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",sans-serif;--body:var(--display);color-scheme:light dark}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body)}main{max-width:1040px;padding:32px 24px 80px;gap:48px}.back{font-size:14px}.back a{color:var(--accent);margin-right:16px}h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em}h1{font-size:clamp(30px,4vw,42px);line-height:1.3}h2{font-size:clamp(23px,3vw,30px);line-height:1.35}.kicker,.step{font-family:var(--display);color:var(--accent);font-size:14px;font-weight:700}.lead{font-size:17px;color:var(--muted);margin:8px 0 0}section{gap:12px}.say{font-size:16px;line-height:1.7;max-width:48em}.pic{border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:none;background:#fff}.map{gap:12px;grid-auto-rows:1fr}.map div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;padding:16px;gap:8px}.map b{font-family:var(--display);font-weight:700;font-size:19px}.map span{color:var(--muted)}.end{background:var(--chip);color:var(--fg);border-left:4px solid var(--accent);border-radius:6px;padding:24px;font:700 21px/1.6 var(--display)}.end strong{color:var(--accent);font-weight:700}dl.words{gap:8px 16px;font-size:16px}dl.words dt{font-family:var(--display);color:var(--accent);font-weight:700}dl.words dd{color:var(--muted)}.emoji{font-size:48px}.map .e{font-size:32px}
@media(max-width:600px){main{padding:24px 16px 64px;gap:32px}.pic{padding:8px}.map{grid-template-columns:1fr 1fr}}@media print{.globalbar,.back{display:none}html,body{background:#fff;color:#000}.pic{break-inside:avoid}}
</style>
</head>
<body>
<div class="globalbar"><b>PES</b><span>프로젝트 실행 시스템</span></div>
<main id="app"></main>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const E = JSON.parse(document.getElementById('data').textContent) || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const em = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const pic = s => s.svg ? `<div class="pic">${s.svg}</div>` : s.emoji ? `<div class="pic emoji" role="img" aria-label="${esc(s.alt || s.big || '')}">${esc(s.emoji)}</div>` : '';
document.getElementById('app').innerHTML = `
  <div class="back"><a href="../../index.html">← 대시보드</a><a href="report.html">자세한 보고서</a></div>
  <header><div class="kicker">${esc(E.stage_label)} 단계 · ${esc(E.name)}</div><h1>${em(E.title)}</h1>${E.lead ? `<p class="lead">${em(E.lead)}</p>` : ''}</header>
  ${(E.scenes || []).map((s, k) => `<section><div class="step">${esc(s.step || `그림 ${k + 1}`)}</div>${s.big ? `<h2>${em(s.big)}</h2>` : ''}${pic(s)}${s.say ? `<p class="say">${em(s.say)}</p>` : ''}</section>`).join('')}
  ${(E.cards || []).length ? `<section>${E.cards_title ? `<h2>${em(E.cards_title)}</h2>` : ''}<div class="map">${E.cards.map(c => `<div>${c.emoji ? `<span class="e">${esc(c.emoji)}</span>` : ''}<b>${em(c.big)}</b>${c.small ? `<span>${em(c.small)}</span>` : ''}</div>`).join('')}</div></section>` : ''}
  ${E.takeaway ? `<div class="end">${em(E.takeaway)}</div>` : ''}
  ${(E.words || []).length ? `<section><h2>어려운 말, 쉽게</h2><dl class="words">${E.words.map(w => `<dt>${esc(w.w)}</dt><dd>${em(w.plain)}</dd>`).join('')}</dl></section>` : ''}`;
</script>
</body>
</html>
