<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #fafaf8; --fg: #1f2328; --muted: #6a737d; --card: #fff; --line: #e4e4e0;
    --accent: #2f6fde; --warn: #b7791f; --bad: #c0392b; --ok: #2e8b57; --chip: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e6e6e6; --muted: #9aa0a6; --card: #1f2227; --line: #33373d;
            --accent: #6ea0ff; --warn: #e0a84a; --bad: #ff7a6b; --ok: #5fcf8f; --chip: #2a2e34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 120px; }
  h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
  .meta { color: var(--muted); font-size: 13px; }
  .pipeline { display: flex; margin: 14px 0; flex-wrap: wrap; }
  .stage { flex: 1; min-width: 80px; text-align: center; font-size: 13px; padding: 6px 4px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .stage:first-child { border-radius: 8px 0 0 8px; } .stage:last-child { border-radius: 0 8px 8px 0; }
  .stage.done { color: var(--ok); }
  .stage.cur { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 650; }
  section.box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin: 16px 0; }
  section.box h2 { font-size: 14.5px; margin: 0 0 8px; }
  dl.inh { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
  dl.inh dt { color: var(--muted); } dl.inh dd { margin: 0; } dl.inh dd.full { grid-column: 1 / -1; }
  textarea { width: 100%; min-height: 70px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 20px; }
  .bar .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar .hint { flex: 1; font-size: 13px; color: var(--muted); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .sent { text-align: center; padding: 30px; font-size: 15px; }

:root { --bg:#f3f5f7; --fg:#202c3c; --muted:#5f6f80; --card:#fff; --line:#d7dfe7; --accent:#245e9e; --ok:#317057; --warn:#98681b; --bad:#ad3e3e; --chip:#edf1f5; --soft:#f7f9fb; }
@media(prefers-color-scheme:dark){:root{--bg:#131b25;--fg:#e3eaf2;--muted:#a8b6c5;--card:#1c2735;--line:#39495d;--accent:#92bffe;--ok:#8bd5af;--warn:#f0c276;--bad:#ffaaa4;--chip:#293747;--soft:#212e3d;color-scheme:dark;}}
.globalbar { max-width:1296px; margin:0 auto; padding:32px 0 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; color:var(--fg); font:700 21px/1.4 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; letter-spacing:.08em; }
.globalbar span{font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:1360px){.globalbar{margin:0 32px}}@media(max-width:600px){.globalbar{margin:0 16px;padding-top:20px}}

body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif; font-size:14px; line-height:1.65; }
main { max-width:960px; padding:32px 24px 144px; }
h1 { font-size:23px; line-height:1.3; margin:0 0 8px; }.meta{font-size:13px}.pipeline{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));flex-wrap:nowrap;overflow-x:auto;margin:24px 0 32px;border:1px solid var(--line);border-radius:6px}.stage{min-width:0;border:0;border-right:1px solid var(--line);border-top:3px solid transparent;padding:12px 8px;font-size:13.5px}.stage:first-child,.stage:last-child{border-radius:0}.stage:last-child{border-right:0}.stage.done{border-top-color:var(--ok)}.stage.cur{border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--accent)}
section.box{border-radius:6px;padding:24px;margin:0 0 24px}section.box h2{font-size:16px;margin:0 0 16px}dl.inh{gap:8px 16px}.bar{padding:12px 24px}.bar .inner{max-width:912px;gap:12px}.bar button{border-radius:5px}button.primary{background:var(--accent);color:#fff}@media(prefers-color-scheme:dark){button.primary{color:#13263d}}
@media(max-width:600px){main{padding:24px 16px 180px}.bar .inner{flex-wrap:wrap}.bar .hint{flex-basis:100%}section.box{padding:16px}}
</style>
</head>
<body>
<div class="globalbar"><b>PES</b><span>프로젝트 실행 시스템</span></div>
<main id="app"></main>
<div class="bar"><div class="inner">
  <div class="hint" id="hint">추천 답이 미리 골라져 있습니다. 바꿀 것만 바꾸고 보내세요.</div>
  <button id="copy">복사</button>
  <button id="send" class="primary" style="display:none">Claude에게 보내기</button>
</div></div>
<div class="toast" id="toast"></div>

<!--__QUESTIONS__-->
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent) || {};
const SP = D.spec || {};
const esc = QF.esc;
const STAGES = ['기획', '조사', '분석-종합', '집필', '검증', '산출-공유'];
const KIND = { stage_start: '단계 시작 질문', review: '라운드 점검 질문', approve: '단계 승인', resume: '이어하기 확인' };
const qs = SP.questions || [];

function render() {
  const ST = (D.stages || STAGES.map(l => ({ label: l }))).map(s => ({ ...s, label: ({ analyze: '분석-종합', publish: '산출-공유' })[s.key] || s.label }));
  const cur = ST.findIndex(x => x.key === SP.stage || x.label === SP.stage_label);
  // inherited 는 {label, value} 객체 또는 "라벨: 값" 문자열 둘 다 받는다
  const inhPair = x => { if (x && typeof x === 'object') return [x.label || '', String(x.value ?? '')]; const s = String(x ?? ''), i = s.indexOf(':'); return i > 0 && i < 30 ? [s.slice(0, i).trim(), s.slice(i + 1).trim()] : ['', s]; };
  const inh = (SP.inherited || []).length ? `<section class="box"><h2>이미 정해진 것</h2><dl class="inh">${SP.inherited.map(inhPair).map(([l, v]) => l ? `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>` : `<dd class="full">${esc(v)}</dd>`).join('')}</dl></section>` : '';
  document.getElementById('app').innerHTML = `
    <h1>${esc(SP.title || '질문')}</h1>
    <div class="meta">${esc(KIND[SP.kind] || '')}${D.topic ? ' · ' + esc(D.topic) : ''} · 만든 시각 ${esc(D.built || '')}</div>
    ${cur >= 0 ? `<div class="pipeline">${ST.map((s, k) => `<div class="stage ${k === cur ? 'cur' : ''} ${s.status === 'approved' ? 'done' : ''}">${s.status === 'approved' ? '✓ ' : ''}${esc(s.label)}</div>`).join('')}</div>` : ''}
    ${SP.intro ? `<p>${esc(SP.intro)}</p>` : ''}
    ${inh}
    <section class="box" id="qbox"><h2>질문 (${qs.length})</h2>${QF.render(qs, 'a-')}</section>
    <section class="box"><h2>덧붙일 말 (선택)</h2><textarea id="free" placeholder="질문에 없는 요청이나 조건"></textarea></section>`;
  QF.applyShow(document.getElementById('qbox'), qs);
}
render();
const root = () => document.getElementById('qbox');
document.addEventListener('change', () => QF.applyShow(root(), qs));

function payload() {
  const c = QF.collect(root(), qs);
  const free = document.getElementById('free').value.trim();
  const text = [`[${KIND[SP.kind] || '답변'}${SP.stage_label ? ' · ' + SP.stage_label : ''}]`, ...c.lines, free && `덧붙임: ${free}`].filter(Boolean).join('\n');
  return { c, text, body: { round: SP.round || 0, kind: SP.kind || 'stage_start', stage: SP.stage || '', spec: SP.id || '', text, answers: c.answers, note: free } };
}
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2000); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('복사했습니다. 채팅창에 붙여넣으세요.');
}
const sendBtn = document.getElementById('send');
if (location.protocol.startsWith('http')) fetch('ping').then(r => r.ok && r.json()).then(j => { if (j && j.ok) sendBtn.style.display = ''; }).catch(() => {});
document.getElementById('copy').onclick = () => { const p = payload(); if (p.c.missing.length) return toast('필수 질문(*)에 답해 주세요.'); copy(p.text); };
sendBtn.onclick = async () => {
  const p = payload();
  if (p.c.missing.length) { p.c.missing[0] && root().querySelector('.q-missing')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('필수 질문(*)에 답해 주세요.'); }
  try {
    const r = await fetch('feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p.body) });
    if (!r.ok) throw new Error(r.status);
    sendBtn.disabled = true; sendBtn.textContent = '보냈습니다 ✓';
    document.getElementById('hint').textContent = 'Claude가 답을 받아 다음 작업을 시작합니다. 결과가 준비되면 대시보드(/index.html)에 나타납니다.';
    toast('Claude에게 보냈습니다.');
  } catch { toast('보내기 실패 — 복사해서 채팅에 붙여넣어 주세요.'); copy(p.text); }
};

// ---- 새 결과 알림: 다른 컴퓨터(원격)에서 열어 둔 화면도 결과가 바뀌면 알아챈다 ----
(function liveUpdate() {
  if (!location.protocol.startsWith('http')) return;
  let base = null, shown = false, dirty = false;
  document.addEventListener('input', () => { dirty = true; }, true);
  const bar = document.createElement('div');
  bar.id = 'pes-live';
  bar.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:6px;background:var(--accent,#245e9e);color:#fff;font:600 14px/1.4 system-ui,-apple-system,"Malgun Gothic",sans-serif;box-shadow:0 6px 20px #0003';
  bar.innerHTML = '<span>새 결과가 올라왔습니다</span><button style="font:inherit;padding:4px 12px;border:0;border-radius:4px;background:#fff;color:#245e9e;cursor:pointer">새로 보기</button>';
  bar.querySelector('button').onclick = () => location.reload();
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(bar));
  if (document.body) document.body.appendChild(bar);
  const tick = async () => {
    try {
      const j = await (await fetch('version', { cache: 'no-store' })).json();
      if (base === null) { base = j.v; return; }
      if (j.v > base && !shown) {
        shown = true;
        if (!dirty) { location.reload(); return; }   // 입력 중이 아니면 바로 새로고침
        bar.style.display = 'flex';                  // 입력 중이면 알림만
        try { document.title = '● ' + document.title; } catch (e) {}
      }
    } catch (e) {}
  };
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
