name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.13"

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        timeout-minutes: 8
        run: python -m pytest -q -p no:cacheprovider

  typescript:
    name: ${{ matrix.os }} / Node 26 (${{ matrix.shard }}/8)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        # CLI 시험은 명령마다 Python·Node 브리지를 띄워 Windows 에서 느리다. 시험 파일을 8조각으로 나눠 병렬로 돌린다
        # (시험·상한은 그대로, 조각 합 = 전체 — node --test --test-shard).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install development dependencies
        run: npm ci

      - name: Print runtime versions
        run: node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); console.log('node ' + process.version); console.log('sqlite ' + db.prepare('select sqlite_version() as v').get().v); db.close();"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (shard ${{ matrix.shard }}/8)
        run: node --test --test-shard=${{ matrix.shard }}/8 "tests/**/*.test.ts"
