name: D1 smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/pes_core/**"
      - "tests/d1/**"
      - "tests/test_d1_smoke.test.ts"
      - "tests/test_cross_d1.test.ts"
      - "tests/fixtures/contracts/cross/**"
      - ".github/workflows/d1-smoke.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-smoke:
    name: d1-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install root dependencies
        run: npm ci

      - name: Install local D1 tools
        run: cd tests/d1 && npm ci

      # SEL-103: 임시 HOME 에서 시작해야 한다(실제 계정 홈에서 시작하면 --import 진입점이 바로 실패시킨다).
      - name: Run D1 smoke and the A·B cross D1 table
        env:
          PES_D1_SMOKE: "1"
          HOME: ${{ runner.temp }}/pes-test-home
          USERPROFILE: ${{ runner.temp }}/pes-test-home
        run: |
          mkdir -p "$HOME"
          node --test --import ./tests/helpers/require_temp_home.ts tests/test_d1_smoke.test.ts tests/test_cross_d1.test.ts
