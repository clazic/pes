openapi: 3.1.0
info:
  title: PES API v1
  version: "1.0"
  description: |
    Closed HTTP/JSON command surface for PES projects. Business writes go through
    the PES command service; there is no table CRUD, arbitrary SQL, or generic
    command route. Revision and fence values travel as normalized decimal
    strings. A successful body is
    {format_version, request_id, data, replayed?}; an error body is
    {format_version, error:{code, message, retryable, target, details,
    next_action}, request_id}. POST writes require Idempotency-Key.
servers:
  - url: http://127.0.0.1:8760
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: PES project token
    localSession:
      type: apiKey
      in: header
      name: x-pes-session
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: r
      in: path
      required: true
      schema: { type: string }
    ObjectId:
      name: o
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: v
      in: path
      required: true
      schema: { type: string }
    BlobId:
      name: b
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    MethodNotAllowed:
      description: Method not allowed; the Allow header names the supported methods
      headers:
        Allow:
          description: Comma-separated list of methods allowed on this path
          schema: { type: string }
  schemas:
    VersionRead:
      type: object
      required: [format_version, request_id, data]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        data:
          type: object
          required: [project_id, object_id, kind, version_id, version_no, is_current, content_hash, content, files]
          properties:
            project_id: { type: string }
            object_id: { type: string }
            kind: { type: string }
            version_id: { type: string }
            version_no: { type: integer }
            is_current: { type: boolean }
            content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
            content:
              oneOf:
                - $ref: "#/components/schemas/ArtifactContent"
                - $ref: "#/components/schemas/SourceContent"
                - { type: "null" }
            files:
              type: array
              items:
                type: object
                required: [blob_id, role]
                properties:
                  blob_id: { type: string }
                  role: { type: string }
    ArtifactContent:
      type: object
      required: [title, summary, body_md]
      properties:
        title: { type: string }
        summary: { type: string }
        body_md: { type: [string, "null"] }
    SourceContent:
      type: object
      required: [title, url, quote, locator, source_kind, method, verification_state]
      properties:
        title: { type: string }
        url: { type: [string, "null"] }
        quote: { type: [string, "null"] }
        locator: { type: object }
        source_kind: { type: string }
        method: { type: string }
        verification_state: { type: string }
    Success:
      type: object
      required: [format_version, request_id, data]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        data: {}
        replayed: { type: boolean }
    Error:
      type: object
      required: [format_version, request_id, error]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        error:
          type: object
          required: [code, message, retryable, target, details, next_action]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            target: { type: [string, "null"] }
            details: { type: [object, "null"] }
            next_action: { type: [string, "null"] }
    ProjectCreate:
      type: object
      required: [slug, topic, owner_display_name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        topic: { type: string, minLength: 1 }
        owner_display_name: { type: string, minLength: 1 }
    RunCreate:
      type: object
      required: [actor_id, mode, runtime, provider, model]
      additionalProperties: false
      properties:
        actor_id: { type: string, minLength: 1 }
        mode: { type: string, enum: [A, B] }
        runtime: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
    ClaimFresh:
      type: object
      required: [mode, runtime, provider, model]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [A, B] }
        runtime: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        expected_control_rev: { type: string }
    ClaimResume:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        expected_control_rev: { type: string }
    ClaimBody:
      oneOf:
        - $ref: "#/components/schemas/ClaimFresh"
        - $ref: "#/components/schemas/ClaimResume"
    WaitBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        reason: { type: string }
        wait_ms:
          type: integer
          minimum: 0
          maximum: 25000
          description: "Response delay only; the real input long-poll is PR14"
    ResultItem:
      type: object
      required: [op, object_id]
      additionalProperties: false
      properties:
        op: { type: string, const: "append_version" }
        object_id: { type: string, minLength: 1 }
        based_on_version_id: { type: string }
        title: { type: string }
        summary: { type: string }
        question: { type: [string, "null"] }
        body_md: { type: [string, "null"] }
        status: { type: string }
        confidence: { type: [string, "null"] }
        stats: { type: array }
        conflicts: { type: array }
        verify: {}
        metadata: { type: object }
        url: { type: string }
        locator: { type: object }
        retrieved_at: { type: integer, minimum: 0 }
        method: { type: string }
        verification_state: { type: string }
        quote: { type: [string, "null"] }
        verified_by_actor_id: { type: [string, "null"] }
    ResultsBody:
      type: object
      required: [lease_id, fence, results]
      additionalProperties: false
      properties:
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        expected_control_rev: { type: string }
        results:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ResultItem" }
    CompleteBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        status: { type: string, enum: [succeeded, failed] }
    UploadReserve:
      type: object
      required: [sha256, size, media_type]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 0 }
        media_type: { type: string, minLength: 1 }
        original_name: { type: string }
    UploadComplete:
      type: object
      additionalProperties: false
paths:
  /api/v1/capabilities:
    get:
      summary: Supported routes, scopes, and limits (open; content grows in PR14)
      responses:
        "200":
          description: Capability object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects:
    post:
      summary: Create a project, its owner, initial policy, and first edition in one transaction
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Local session required }
        "409": { description: Duplicate slug or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/context:
    get:
      summary: Read the project's consistency boundary, policy, stages, manifest, and lease
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/objects/{o}/versions/{v}:
    get:
      summary: Read one exact object version (kind, number, content hash, attached files)
      description: |
        data = {project_id, object_id, kind, version_id, version_no (integer),
        is_current (true when objects.current_version_id points at it),
        content_hash (64 hex), content, files:[{blob_id, role}]}. A project, object, and
        version that do not belong together are 404. content is the version's own
        stored text (the value at that version, not the current one). Agent
        (non-human) requests omit files whose AI access is denied; the human
        owner sees them.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/VersionId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionRead" }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing context:read scope or Go policy denied }
        "404": { description: Unknown project, object, or version, or a mismatched pair }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs:
    post:
      summary: Owner queues a run for an agent actor (no lease is taken)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "201":
          description: Queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Local session required }
        "403": { description: Agent tokens cannot start runs }
        "404": { description: Unknown project or target actor }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/claims:
    post:
      summary: Claim a queued run or create and claim a fresh run
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimBody" }
      responses:
        "200":
          description: Lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project }
        "409": { description: Live lease, stale revision, or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/wait:
    post:
      summary: Commit waiting_human, release the lease, then optionally hold the response
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitBody" }
      responses:
        "200":
          description: Waiting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid wait_ms or payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project or run }
        "409": { description: Lease is not current }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/results:
    post:
      summary: Submit 1-20 version appends as one atomic result bundle
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsBody" }
      responses:
        "200":
          description: Submitted versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload or closed result list }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown object or run }
        "409": { description: Lease is not current, stale revision, or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/complete:
    post:
      summary: End the run (not an approval or a seal)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteBody" }
      responses:
        "200":
          description: Completed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid status or payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project or run }
        "409": { description: Lease is not current or the run already ended }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads:
    post:
      summary: Reserve a staging blob (no download URL is returned)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadReserve" }
      responses:
        "201":
          description: New staging reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "200":
          description: Deduplicated reservation of an existing ready blob
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid reservation }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown project }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads/{b}:
    put:
      summary: Upload raw bytes for a staging blob
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Bytes stored; the blob is still staging until complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Bytes do not match the reservation }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown blob in this project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads/{b}/complete:
    post:
      summary: Re-read the stored bytes and move staging to ready or quarantined
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "200":
          description: Ready or quarantined blob
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown blob in this project }
        "409": { description: The blob is not staging or has no stored bytes }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/files/{b}/content:
    get:
      summary: Read a ready blob through the PES proxy (policy checked on every read)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:read scope or Go policy denied }
        "404": { description: Unknown blob in this project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { description: Blob is not ready or stored bytes do not match }
