        CURRENT version, so a judged assumption shows the judgement; the proposal stays in its older version. revised_from_* are set
        only when state is "revised": the version that stood before the fix and its sentence (both null otherwise). actor kind is
        "human" for a human actor and "ai" for every other actor kind. An empty list is "no records", never a made-up row.
