        "404": { description: Unknown project or target }
        "409": { description: "supersedes_conflict (the decision it replaces is not adopted), conflict with details.reason edition_not_active (a decision of a draft edition widened to project scope), a transition the table does not allow, stale base_version_id (rev_conflict), or idempotency key reuse" }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "422": { description: "A field breaks the rules (validation_failed; adopting or revoking with a statement that differs from the decision's own sentence is $.body.statement, reason statement_changed)" }
        "429": { description: Request budget spent; see Retry-After }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    get:
      summary: Read the decisions of an edition and the project-wide ones (one current row each; the active edition unless ?edition= says otherwise)
      description: |
        data = {edition (integer), decisions:[{id, version_id, version_no (decimal string), statement, state, scope,
        decided_by_actor_id|null, decided_by {id, kind, name}|null, proposed_by {id, kind, name} (whoever wrote the first version),
        rationale, supersedes_decision_id|null, superseded_by|null (the decision that replaced this one),
        originated_from_version_id|null, originated_from_version_no|null (decimal string), originated_from_edition_no|null
        (integer)}]}. A superseded or revoked decision stays as a line with that state. originated_from_* are set only for an
        edition decision that was copied into a new edition: the parent's version it came from, that version's number and the
