      description: |
        With ?round_id=, or with ?stage=&round_no= (and optionally ?edition=<edition_no>, the active edition when absent):
        data = {round_id, stage (stage key), round_no (integer), submitted (bool), counts:{applied, partial, rejected, deferred},
        entries:[{id, source_version_id, source_text|null, disposition, rationale, result_version_id|null, followup_id|null,
        followup {id, kind, state, description, result_version_id|null}|null, applied_tx_id|null, actor_id, actor {id, kind, name}}]}.
        source_text is the sentence of the source when it is an assumption, decision or message version, and null for anything without a
        sentence (a text artifact version). submitted is false before any submission and true after one, even when it had no entries
        ("0 items"). round_id together with edition, stage or round_no is 400 invalid_payload; stage without round_no (or the other way
        round) is 400; round_no that is not a positive integer is 400 ($.query.round_no); a stage key or round number the edition does not
        have is 404 not_found ($.query.round_no), an edition number the project does not have is 404 ($.query.edition).
        Without any of them: data = {reflections:[<the same object>]} for the rounds that have a submission.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: round_id
          in: query
          required: false
          schema: { type: string }
        - name: edition
          in: query
          required: false
