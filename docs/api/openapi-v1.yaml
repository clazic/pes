  /api/v1/projects/{id}/workspace:
    get:
      summary: "Work-space read model for the web app (SEL-82 U1b): slug, title, edition, mode, current stage and round, stages with their rounds, whose turn it is, the actions this caller can take (with a reason when one cannot), and record counts. Read-only; machine values only (the screen makes its own words)"
      description: "data = { slug, title, edition, mode (A|B), current {stage, round_id|null}, stages [{key, view, rounds [{round_id|null, state}]}], turn {side}, actions [{action, enabled, disabled_reason|null}], records {assumptions, decisions, comments: {count}, empty}, ai_connection {policy, dispatches [{id, run_id, state, resolution?}]}, runs [{id, stage|null, mode, status}] }, and stages[].past_approval {at|null, origin} on a stage that has an approval row. round_id null is the stage-start place (there is no R0). actions are for display; the server still checks every write. SEL-87 fields (read-only, no new table, machine values only): ai_connection.policy = allowed|denied|missing|corrupt from the allow_opencode_go bit of the current policy row (NULL pointer = missing; any other damage = corrupt; never pending - the DB holds only confirmed rows). dispatches[].state is the outbound_dispatches value as stored (prepared authorized sent response adopted blocked failed unknown); resolution (charged|not_charged) is present only when a dispatch_resolutions row exists. runs[].status is the runs value as stored (queued running waiting_human blocked_usage succeeded failed cancelled interrupted), except a hand-off import run reads handed_off (the owner's succeeded import run: runtime claude_app_handoff, codex_app_handoff or opencode_app_handoff, made by a human actor, status succeeded; the runtime name alone is not enough, so an agent run that claimed with such a runtime name keeps its stored status); stage is null when the run has no stage. past_approval.at is the approval commit time (ISO 8601) or null when that time is unknown (0); origin is verified or legacy_unverified; a stage never approved has no key. Lists are capped: only the newest 50 dispatches and the newest 50 runs are sent (oldest of those first). runs are limited to the ACTIVE edition (runs.edition_id), so an older edition's runs are not shown; dispatches are NOT limited by edition (what was sent out and what must be settled are facts of the whole project), so the newest 50 dispatches of the project are sent whatever edition their run belongs to (dispatches[].run_id may point at a run that is not in runs[]). A past_approval.at that is not a valid time (a damaged value) is null, never an error. NOT sent, on purpose (no DB evidence): run_permissions (nothing stores external-app questions or permissions), cancel_state (no cancel-attempt column or event), external_stop (a lost connection is not a cancel), and the policy value pending (no store for an undecided policy). The app draws a missing field as unknown / no information, never as on or none."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      security: [{ agentToken: [] }, { localSession: [] }]
      responses:
        "200":
          description: Accepted or successful answer
          content:
