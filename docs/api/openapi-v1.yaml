openapi: 3.1.0
info:
  title: PES API v1
  version: "1.0"
  description: |
    Closed HTTP/JSON command surface for PES projects. Business writes go through
    the PES command service; there is no table CRUD, arbitrary SQL, or generic
    command route. Revision and fence values travel as normalized decimal
    strings. A successful body is
    {format_version, request_id, data, receipt?, replayed?}; a 201 write also carries
    receipt {receipt_no, tx_id, committed_at}; an error body is
    {format_version, error:{code, message, retryable, target, details,
    next_action}, request_id}. POST writes require Idempotency-Key. Every
    request body may carry format_version "1.0" (any other value is 400).
servers:
  - url: http://127.0.0.1:8760
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: PES project token
    localSession:
      type: apiKey
      in: header
      name: x-pes-session
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: r
      in: path
      required: true
      schema: { type: string }
    ObjectId:
      name: o
      in: path
      required: true
      schema: { type: string }
    ReferenceId:
      name: ref
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: v
      in: path
      required: true
      schema: { type: string }
    BlobId:
      name: b
      in: path
      required: true
      schema: { type: string }
    OperationId:
      name: op
      in: path
      required: true
      schema: { type: string }
    RequestKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    QuestionId:
      name: q
      in: path
      required: true
      schema: { type: string }
    QuestionSetId:
      name: set
      in: path
      required: true
      schema: { type: string }
    ThreadId:
      name: t
      in: path
      required: true
      schema: { type: string }
    FollowupId:
      name: f
      in: path
      required: true
      schema: { type: string }
    StageId:
      name: s
      in: path
      required: true
      schema: { type: string }
    RoundId:
      name: rd
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    MethodNotAllowed:
      description: Method not allowed; the Allow header names the supported methods
      headers:
        Allow:
          description: Comma-separated list of methods allowed on this path
          schema: { type: string }
  schemas:
    VersionRead:
      type: object
      required: [format_version, request_id, data]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        data:
          type: object
          required: [project_id, object_id, kind, version_id, version_no, is_current, content_hash, content, files]
          properties:
            project_id: { type: string }
            object_id: { type: string }
            kind: { type: string }
            version_id: { type: string }
            version_no: { type: integer }
            is_current: { type: boolean }
            content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
            content:
              oneOf:
                - $ref: "#/components/schemas/ArtifactContent"
                - $ref: "#/components/schemas/SourceContent"
                - $ref: "#/components/schemas/AnswerContent"
                - $ref: "#/components/schemas/QuestionContent"
                - { type: "null" }
            files:
              type: array
              items:
                type: object
                required: [blob_id, role]
                properties:
                  blob_id: { type: string }
                  role: { type: string }
    ArtifactContent:
      type: object
      required: [title, summary, body_md]
      properties:
        title: { type: string }
        summary: { type: string }
        body_md: { type: [string, "null"] }
    SourceContent:
      type: object
      required: [title, url, quote, locator, source_kind, method, verification_state]
      properties:
        title: { type: string }
        url: { type: [string, "null"] }
        quote: { type: [string, "null"] }
        locator: { type: object }
        source_kind: { type: string }
        method: { type: string }
        verification_state: { type: string }
    AnswerContent:
      type: object
      description: An answer version. state is the answer version's own state (not a run's input receipt state).
      required: [question_version_id, value, state, comment]
      properties:
        question_version_id: { type: string }
        value: {}
        state: { type: string, enum: [submitted, skipped, withdrawn] }
        comment: { type: [string, "null"] }
    QuestionContent:
      type: object
      required: [text, type, state, importance, required, allow_comment_as_answer, default_value, options, show_if, help]
      properties:
        text: { type: string }
        type: { type: string, enum: [single, multi, text, textarea, number, scale, file] }
        state: { type: string }
        importance: { type: string, enum: [high, normal, low] }
        required: { type: boolean }
        allow_comment_as_answer: { type: boolean }
        default_value: {}
        options: { type: array }
        show_if: {}
        help: { type: [string, "null"] }
    InputItem:
      type: object
      description: One answer to the run's own question; read its content at objects/{object_id}/versions/{input_version_id}.
      required: [input_version_id, object_id, kind, question_id, available_at, state]
      properties:
        input_version_id: { type: string }
        object_id: { type: string, description: The answer object }
        kind: { type: string, enum: [answer] }
        question_id: { type: string }
        available_at: { type: integer }
        state: { type: string, enum: [new, seen, applied, ignored] }
    Success:
      type: object
      required: [format_version, request_id, data]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        data: {}
        receipt:
          description: "SEL-98: only on a 201 write (never on an error or a read). The receipt of the commit the write made: receipt_no is a decimal string that grows with the project's writes in commit order, tx_id is the commit id, committed_at is the commit time (ISO 8601, or null when the stored time is damaged). A replay (replayed true) reports the FIRST response's receipt. GET requests/{key} reports the same receipt_no and committed_at in data."
          type: object
          required: [receipt_no, tx_id, committed_at]
          properties:
            receipt_no: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
            tx_id: { type: string }
            committed_at: { type: [string, "null"], format: date-time }
        replayed: { type: boolean }
    Error:
      type: object
      required: [format_version, request_id, error]
      properties:
        format_version: { type: string, const: "1.0" }
        request_id: { type: string }
        error:
          type: object
          required: [code, message, retryable, target, details, next_action]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            target: { type: [string, "null"] }
            details: { type: [object, "null"] }
            next_action: { type: [string, "null"] }
    ProjectCreate:
      type: object
      required: [slug, topic, owner_display_name]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        topic: { type: string, minLength: 1 }
        owner_display_name: { type: string, minLength: 1 }
    RunCreate:
      type: object
      required: [actor_id, mode, runtime, provider, model]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        actor_id: { type: string, minLength: 1 }
        mode: { type: string, enum: [A, B] }
        runtime: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
    RunImport:
      type: object
      description: "Explicit hand-off import (owner session only): the owner's own hand-off run, the pasted results and the end of the run in one step. The receipt and the run belong to the owner (a human actor), via is import, provenance.verified is false; there is no claim, lease or fence. The Idempotency-Key must be import-<request_id>, otherwise 400 invalid_payload ($.headers.idempotency-key), so one bundle cannot be imported twice under two keys. Refusals write nothing: 409 conflict when the stage is approved or the round is sealed (the declared round, or the stage's current round when none is declared; a human reopens the stage or starts a new round first), 400 invalid_payload when one import names the same object more than once (once per object is allowed) or when round_id comes without stage_id."
      required: [import]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        import:
          type: object
          required: [results, request_id]
          additionalProperties: false
          properties:
            results: { type: array, minItems: 1, maxItems: 20, items: { type: object } }
            request_id: { type: string, minLength: 1 }
            stage_id: { type: string }
            round_id: { type: string }
            claimed_tool: { type: string, description: "A claim of the pasted text, never verified" }
            claimed_model: { type: string, description: "A claim of the pasted text, never verified" }
            expected_control_rev: { type: string }
            app:
              type: string
              enum: [claude_app, codex_app, opencode_app]
              description: "The AI app the pasted result comes from (closed list). The server derives the hand-off run's runtime and provider from it: claude_app -> claude_app_handoff/anthropic, codex_app -> codex_app_handoff/openai, opencode_app -> opencode_app_handoff/unknown; the model is always unknown. Absent means claude_app. A value outside the list is 400 invalid_payload ($.body.import.app) and nothing is written."
            expected_heads:
              type: array
              maxItems: 1000
              description: "The object heads the bundle was copied from. Compared with the current heads in the import's own transaction; any difference (or an archived/missing object) is 409 rev_conflict with details.object_id and nothing is written."
              items:
                type: object
                required: [object_id, version_id]
                additionalProperties: false
                properties:
                  object_id: { type: string, minLength: 1 }
                  version_id: { type: string, minLength: 1 }
    ClaimFresh:
      type: object
      required: [mode, runtime, provider, model]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        mode: { type: string, enum: [A, B] }
        runtime: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        expected_control_rev: { type: string }
    ClaimResume:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        run_id: { type: string, minLength: 1 }
        expected_control_rev: { type: string }
    ClaimBody:
      oneOf:
        - $ref: "#/components/schemas/ClaimFresh"
        - $ref: "#/components/schemas/ClaimResume"
    WaitBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        reason: { type: string }
        wait_ms:
          type: integer
          minimum: 0
          maximum: 25000
          description: "Response delay only; the real input long-poll is PR14"
    ResultItem:
      type: object
      required: [op, object_id]
      additionalProperties: false
      properties:
        op: { type: string, const: "append_version" }
        object_id: { type: string, minLength: 1 }
        based_on_version_id: { type: string }
        title: { type: string }
        summary: { type: string }
        question: { type: [string, "null"] }
        body_md: { type: [string, "null"] }
        status: { type: string }
        confidence: { type: [string, "null"] }
        stats: { type: array }
        conflicts: { type: array }
        verify: {}
        metadata: { type: object }
        url: { type: string }
        locator: { type: object }
        retrieved_at: { type: integer, minimum: 0 }
        method: { type: string }
        verification_state: { type: string }
        quote: { type: [string, "null"] }
        verified_by_actor_id: { type: [string, "null"] }
    ResultsBody:
      type: object
      required: [lease_id, fence, results]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        expected_control_rev: { type: string }
        results:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ResultItem" }
    CompleteBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        status: { type: string, enum: [succeeded, failed] }
    UploadReserve:
      type: object
      required: [sha256, size, media_type]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 0 }
        media_type: { type: string, minLength: 1 }
        original_name: { type: string }
    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
    FormatVersion:
      type: string
      const: "1.0"
    RegisterBody:
      type: object
      required: [slug, topic, owner_display_name, device_label]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        topic: { type: string, minLength: 1 }
        owner_display_name: { type: string, minLength: 1 }
        device_label: { type: string, minLength: 1 }
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [context:read, run:claim, run:submit, file:write, file:read] }
    HeartbeatBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        progress:
          type: object
          description: "Optional progress note {phase, observed_at?}; observed_at defaults to the server clock. It is stored in the run.heartbeat receipt and event, and the answer carries the stored note as data.progress (a replay carries the first one) next to run_id, lease and server_time."
          additionalProperties: false
          required: [phase]
          properties:
            phase: { type: string, minLength: 1 }
            observed_at: { type: integer, minimum: 0 }
    ReleaseBody:
      type: object
      required: [lease_id, fence]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
    HandoffBody:
      type: object
      description: >-
        The same run goes back to the queue, so its actor and mode do not change. target_actor_id and target_mode
        may be omitted or name the run's own actor and mode; anything else is 400 invalid_payload and writes nothing.
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        target_mode: { type: string, enum: [A, B] }
        target_actor_id: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        include_pending_inputs: { type: boolean }
    InterruptBody:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        reason: { type: string, minLength: 1 }
        mode: { type: string, enum: [graceful] }
    CancelBody:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        reason: { type: string, minLength: 1 }
        confirm: { type: boolean, const: true }
    ReceiptItem:
      type: object
      required: [input_version_id, state]
      additionalProperties: false
      properties:
        input_version_id: { type: string, minLength: 1 }
        state: { type: string, enum: [seen, applied, ignored] }
        reason: { type: string }
        applied_tx_id: { type: string }
    InputReceiptsBody:
      type: object
      required: [lease_id, fence, receipts]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        lease_id: { type: string, minLength: 1 }
        fence: { type: string }
        receipts:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ReceiptItem" }
    QuestionOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string, minLength: 1 }
        label: { type: string }
        recommended: { type: boolean }
    QuestionSpec:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1 }
        type: { type: string, enum: [single, multi, text, textarea, number, scale, file] }
        required: { type: boolean }
        allow_comment_as_answer: { type: boolean }
        default_value: {}
        options:
          type: array
          items: { $ref: "#/components/schemas/QuestionOption" }
        show_if: {}
        help: { type: [string, "null"] }
        importance: { type: string, enum: [high, normal, low] }
    QuestionPublishBody:
      type: object
      required: [stage_id, purpose, question]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        stage_id: { type: string, minLength: 1 }
        round_id: { type: [string, "null"] }
        purpose: { type: string, enum: [stage_start, review, resume] }
        form_key: { type: string, minLength: 1 }
        direction:
          type: string
          const: agent_to_human
          description: "The core stores every published question as agent_to_human; any other value is 400"
        question: { $ref: "#/components/schemas/QuestionSpec" }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    QuestionReviseBody:
      type: object
      required: [base_version_id, question]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_version_id: { type: string, minLength: 1 }
        question: { $ref: "#/components/schemas/QuestionSpec" }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    QuestionState:
      type: string
      enum: [draft, open, deferred, merged, withdrawn, closed]
      description: "A question version's state. withdraw/defer/merge write a new version with state withdrawn / deferred / merged (earlier versions and answers stay)."
    QuestionWithdrawBody:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_version_id: { type: string, minLength: 1 }
        reason: { type: string }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    QuestionOrderBody:
      type: object
      additionalProperties: false
      required: [question_ids]
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        question_ids:
          description: "Every member of the set, once, in the new order (a permutation). A missing, repeated or unknown id is 422 validation_failed at $.body.question_ids (details.reason not_a_permutation). The current order itself is 422 (details.reason no_change)."
          type: array
          items: { type: string, minLength: 1 }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    QuestionDeferBody:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_version_id: { type: string, minLength: 1 }
        defer_until:
          description: "A time in ms: a non-negative JSON integer, or a decimal string of one (a safe integer either way). Left out or null = no time limit (the schema does not list null, but the server accepts it as \"none\")."
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        reason: { type: string }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    QuestionMergeBody:
      type: object
      required: [merged_into_question_id]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_version_id: { type: string, minLength: 1 }
        merged_into_question_id: { type: string, minLength: 1, description: "An open question of the same project (not this one)" }
        reason: { type: string }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    AnchorBody:
      type: object
      required: [exact_quote]
      additionalProperties: false
      description: |
        A quoted stretch of one version of a text. Positions are CODE POINTS (an emoji is 1, a ZWJ family emoji is 3, a Hangul
        syllable is 1) of the version's body_md exactly as stored (text_format_version 1: no normalization), end_cp is exclusive,
        so end_cp - start_cp is the quote's length in code points. Without a position the quote must stand in one place (prefix and
        suffix may tell the places apart); with a wrong position the place the context picks is used (anchor_status "moved");
        the server never picks one of several places on its own (422 ambiguous_quote).
      properties:
        exact_quote: { type: string, minLength: 1 }
        prefix: { type: string }
        suffix: { type: string }
        start_cp: { type: integer, minimum: 0 }
        end_cp: { type: integer, minimum: 0 }
    ThreadCreateBody:
      type: object
      required: [target_object_id, context_kind, initial_message]
      additionalProperties: false
      description: |
        context_kind "question_comment": a comment on a question (target_object_id is a question; `anchor` is not allowed, 400).
        context_kind "annotation" (SEL-99, stage 3 U4a): a comment on a quoted stretch of a text (target_object_id is a text
        (artifact), target_version_id its version or the current one; `anchor` is required). A token needs the lease (run_id, lease_id, fence).
        201 data = {thread:{id, state:"open", anchor_id, anchor_status:"exact"|"moved"}, message:{id, version_no:"1"}} for an annotation.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        target_object_id: { type: string, minLength: 1, description: "The question the comment is about, or the text the annotation is on" }
        target_version_id: { type: string, description: "A version of that object; the current one when absent" }
        context_kind: { type: string, enum: [question_comment, annotation] }
        anchor: { $ref: "#/components/schemas/AnchorBody" }
        initial_message:
          type: object
          required: [body_md]
          additionalProperties: false
          properties:
            body_md: { type: string, minLength: 1 }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    ThreadResolutionBody:
      type: object
      required: [resolution, reason]
      additionalProperties: false
      description: |
        The owner session closes a thread (a token is 403 human_required). RESOLVED IS NOT APPLIED: the text and the reflection
        entries do not change; a change to be made becomes a follow-up in state "proposed" (followup.kind must be the resolution;
        "none" takes no follow-up; the others need one). reason is stored as the closing message.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        resolution: { type: string, enum: [edit_text, next_round_task, reopen_stage, none] }
        reason: { type: string, minLength: 1 }
        followup:
          type: object
          additionalProperties: false
          properties:
            kind: { type: string, enum: [edit_text, next_round_task, reopen_stage] }
            description: { type: string }
            proposed_body_md: { type: string, description: "edit_text: the new text (stored as a version that is not the current one)" }
            target_version_id: { type: string, description: "edit_text: the version the change is based on (the current one when absent)" }
            target_stage_id: { type: string, description: "next_round_task and reopen_stage: required" }
            target_round_id: { type: string }
    ThreadReanchorBody:
      type: object
      additionalProperties: false
      description: |
        Without start_cp/end_cp: judge the anchor again against a version (default the current one) - exact, moved, ambiguous (candidates
        only, nothing is chosen) or lost (nothing is deleted); a judgement is a new row, never an update. With start_cp and end_cp
        (both): the owner session pins the anchor to that stretch (a token is 403 human_required).
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        version_id: { type: string }
        start_cp: { type: integer, minimum: 0 }
        end_cp: { type: integer, minimum: 0 }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    FollowupCreateBody:
      type: object
      required: [origin_thread_id, kind, description]
      additionalProperties: false
      description: |
        Propose a follow-up of a thread (the owner session, or a token holding the lease). A proposal is never an adoption.
        edit_text needs proposed_body_md (stored as a new version that is NOT the current one; base_version_id defaults to the current
        version); next_round_task and reopen_stage need target_stage_id.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        origin_thread_id: { type: string, minLength: 1 }
        kind: { type: string, enum: [edit_text, next_round_task, reopen_stage, none] }
        description: { type: string, minLength: 1 }
        proposed_body_md: { type: string }
        base_version_id: { type: string }
        target_stage_id: { type: string }
        target_round_id: { type: string }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    FollowupApplyBody:
      type: object
      required: [base_version_id, expected_rev]
      additionalProperties: false
      description: |
        The owner session adopts a follow-up (3단계 U4a: people only; an agent token is 403 human_required - an agent applying a
        follow-up is left for later). edit_text: the proposed text becomes a NEW version of the text and the current version moves to
        it (the old version stays). base_version_id must be the version the follow-up was proposed for AND still the current one
        (else 409 basis_changed, nothing changes); expected_rev is the follow-up's current version number (else 409 rev_conflict).
        Applying neither resolves the thread nor writes a reflection entry.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_version_id: { type: string, minLength: 1 }
        expected_rev: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    ThreadMessageBody:
      type: object
      required: [body_md]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        body_md: { type: string, minLength: 1 }
        reply_to: { type: string }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
    AssumptionBody:
      type: object
      required: [state]
      additionalProperties: false
      description: |
        state "proposed" proposes an assumption (statement required; rationale optional; scope is accepted and ignored):
        the owner session or an agent token. state "confirmed" | "rejected" | "revised" judges one (assumption_id and
        base_version_id required; "rejected" and "revised" need a rationale; "revised" also needs the new statement):
        the owner session only, a token is 403 human_required. A judgement is always a NEW version; the proposal is kept.
        An assumption of a past edition (completed or archived) cannot be judged: 409 conflict, details.reason edition_closed.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        state: { type: string, enum: [proposed, confirmed, rejected, revised] }
        statement: { type: string, minLength: 1 }
        rationale: { type: string }
        scope: { type: string, enum: [project, edition] }
        assumption_id: { type: string, minLength: 1 }
        base_version_id: { type: string, minLength: 1 }
    DecisionBody:
      type: object
      required: [scope, state]
      additionalProperties: false
      description: |
        state "proposed" proposes a decision (statement and scope required; the owner session or an agent token).
        state "adopted" with decision_id + base_version_id adopts a proposal; state "adopted" with supersedes (the
        adopted decision it replaces) + base_version_id + statement + rationale makes a NEW decision and marks the old
        one superseded; state "revoked" with decision_id + base_version_id + rationale revokes an adopted decision.
        Everything but a proposal is the owner session only (a token is 403 human_required, and a token that names
        `supersedes` is 403 at once, whatever its state). A superseded target that is not adopted is 409
        supersedes_conflict at $.body.supersedes (next_action reread_decisions). When adopting or revoking, `scope`
        must be the decision's own scope (else 422 validation_failed at $.body.scope, reason scope_mismatch). A
        supersede request has no decision_id (400 invalid_payload). Adopting, superseding or revoking an edition-scope
        decision of a past edition (completed or archived) is 409 conflict, details.reason edition_closed; a draft
        edition is open, and a project-scope decision is not bound to an edition. The new decision of a supersede is
        written into the edition of the decision it replaces. Repeating a supersede request with the same
        Idempotency-Key and body replays the first 201 (replayed true); the same key with another body is
        409 idempotency_key_reuse.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        scope: { type: string, enum: [project, edition] }
        statement: { type: string, minLength: 1 }
        state: { type: string, enum: [proposed, adopted, revoked] }
        supersedes: { type: [string, "null"] }
        rationale: { type: string }
        decision_id: { type: string, minLength: 1 }
        base_version_id: { type: string, minLength: 1 }
    ReflectionBody:
      type: object
      required: [target_round_id, entries]
      additionalProperties: false
      description: |
        The reflection of one round. entries may be empty: that is a submission of "0 items", not "not submitted".
        applied | partial need evidence: evidence_tx_id plus result_version_id and/or followup_id. The commit must be
        the one that made the result version (and not the source version), and a follow-up must be applied by that
        commit. Missing evidence is 422 evidence_required at $.body.entries[i].result_version_id (next_action
        add_evidence); evidence that does not fit together is 422 validation_failed at $.body.entries[i].evidence_tx_id.
        The result version must be something that can be the RESULT of handling an opinion (an allow list): a text
        (artifact) version, a judged assumption (confirmed, rejected, revised) or a judged decision (adopted,
        superseded, revoked). Any other version (a proposal, a message, a thread, a question, an answer, a source ...)
        is 422 validation_failed at $.body.entries[i].result_version_id (details.reason evidence_mismatch), because
        a token can make such a version in one write and so always pair it with the commit that made it. A follow-up
        must come from the entry's own source (followups.origin_version_id).
        rejected | deferred need only a rationale and take no evidence fields.
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        target_round_id: { type: string, minLength: 1 }
        entries:
          type: array
          maxItems: 200
          items:
            type: object
            required: [source_version_id, disposition, rationale]
            additionalProperties: false
            properties:
              source_version_id: { type: string, minLength: 1 }
              disposition: { type: string, enum: [applied, partial, rejected, deferred] }
              rationale: { type: string, minLength: 1 }
              result_version_id: { type: [string, "null"] }
              followup_id: { type: [string, "null"] }
              evidence_tx_id: { type: [string, "null"] }
              supersedes_entry_id: { type: [string, "null"], description: "An earlier entry of the same round this one replaces. An entry is replaced once: naming one that is already replaced (by an earlier call or by another entry of this request) is 409 conflict, details.reason entry_replaced." }
    AnswerItem:
      type: object
      required: [question_id]
      additionalProperties: false
      properties:
        question_id: { type: string, minLength: 1 }
        question_version_id: { type: string, minLength: 1 }
        value: {}
        comment: { type: [string, "null"] }
        used_default: { type: boolean }
    SubmissionBody:
      type: object
      required: [set_id, answers]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        set_id: { type: string, minLength: 1 }
        answers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AnswerItem" }
        mode: { type: string, enum: [bundle, single], description: "bundle: every applicable required question of the form must be filled (422 required_missing / not_applicable); single: exactly one item. Absent: a partial submission is accepted as before. The response carries form_complete and missing_required" }
        submitted_via: { type: string, description: "Checked, not stored (the server sets via)" }
        client_request_id: { type: string, description: "Checked, not stored (the Idempotency-Key header is the key)" }
    RoundStartBody:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        base_stage_rev: { type: string }
    RoundSealBody:
      type: object
      required: [manifest_blob_id, versions]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        manifest_blob_id: { type: string, minLength: 1 }
        versions: { type: array }
        run_id: { type: string }
        lease_id: { type: string }
        fence: { type: string }
        snapshot_scope: { type: string, enum: [round] }
        expected_round_rev: { type: string }
    StageApproveBody:
      type: object
      required: [snapshot_id]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        snapshot_id: { type: string, minLength: 1 }
        expected_stage_rev: { type: string }
        confirm: { type: string, enum: [owner] }
    StageReopenBody:
      type: object
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        reason: { type: string, minLength: 1 }
        expected_stage_rev: { type: string }
    PolicyRevisionBody:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        format_version: { $ref: "#/components/schemas/FormatVersion" }
        reason: { type: string, minLength: 1 }
        allow_opencode_go: { type: boolean }
        go_usage_stop_percent: { type: integer, minimum: 50, maximum: 100 }
        mode_a_model: { type: string, minLength: 1 }
        expected_policy_rev: { type: string }
paths:
  /api/v1/capabilities:
    get:
      summary: Supported routes, scopes, and limits (open; content grows in PR14)
      responses:
        "200":
          description: Capability object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects:
    post:
      summary: Create a project, its owner, initial policy, and first edition in one transaction
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Local session required }
        "409": { description: Duplicate slug or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/context:
    get:
      summary: Read the project's consistency boundary, policy, stages, manifest, materials, lease and reference-material list
      description: |
        data also carries `references`: the list of the project's reference material from earlier projects, rows only
        (never a body) in the same shape as GET /references. Read a body with GET /references/{ref}.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/objects/{o}/versions/{v}:
    get:
      summary: Read one exact object version (kind, number, content hash, attached files)
      description: |
        data = {project_id, object_id, kind, version_id, version_no (integer),
        is_current (true when objects.current_version_id points at it),
        content_hash (64 hex), content, files:[{blob_id, role}]}. A project, object, and
        version that do not belong together are 404. content is the version's own
        stored text (the value at that version, not the current one). Agent
        (non-human) requests omit files whose AI access is denied; the human
        owner sees them.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/VersionId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionRead" }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing context:read scope or Go policy denied }
        "404": { description: Unknown project, object, or version, or a mismatched pair }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs:
    post:
      summary: Owner queues a run for an agent actor (no lease is taken), or imports a pasted hand-off result
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/RunCreate" }
                - { $ref: "#/components/schemas/RunImport" }
      responses:
        "201":
          description: Queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Local session required }
        "403": { description: "Agent tokens cannot start runs; a mode A or opencode-go run for a target actor that is not internal_ai is forbidden (SEL-68); Go policy denied" }
        "404": { description: Unknown project or target actor }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/claims:
    post:
      summary: Claim a queued run or create and claim a fresh run
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimBody" }
      responses:
        "200":
          description: Lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Missing or invalid credential }
        "403": { description: "Missing scope, or Go policy denied for an internal_ai caller; a mode A or opencode-go (provider or model prefix) claim, or a claim by run_id of such a run, by any caller that is not internal_ai (external_agent token, human session) is forbidden (SEL-68)" }
        "404": { description: Unknown project }
        "409": { description: Live lease, stale revision, or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/wait:
    post:
      summary: Commit waiting_human, release the lease, then optionally hold the response
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitBody" }
      responses:
        "200":
          description: Waiting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid wait_ms or payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project or run }
        "409": { description: Lease is not current }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/results:
    post:
      summary: Submit 1-20 version appends as one atomic result bundle (agent tokens only; an owner session gets 403, an owner import goes through POST /runs)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsBody" }
      responses:
        "200":
          description: Submitted versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload or closed result list }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown object or run }
        "409": { description: Lease is not current, stale revision, or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/runs/{r}/complete:
    post:
      summary: End the run (not an approval or a seal)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteBody" }
      responses:
        "200":
          description: Completed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid status or payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing scope or Go policy denied }
        "404": { description: Unknown project or run }
        "409": { description: Lease is not current or the run already ended }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads:
    post:
      summary: Reserve a staging blob (no download URL is returned)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadReserve" }
      responses:
        "201":
          description: New staging reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "200":
          description: Deduplicated reservation of an existing ready blob
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid reservation }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown project }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads/{b}:
    put:
      summary: Upload raw bytes for a staging blob
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Bytes stored; the blob is still staging until complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Bytes do not match the reservation }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown blob in this project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/uploads/{b}/complete:
    post:
      summary: Re-read the stored bytes and move staging to ready or quarantined
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "200":
          description: Ready or quarantined blob
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Invalid payload }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown blob in this project }
        "409": { description: The blob is not staging or has no stored bytes }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/files/{b}/content:
    get:
      summary: Read a ready blob through the PES proxy (policy checked on every read)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:read scope or Go policy denied }
        "404": { description: Unknown blob in this project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { description: Blob is not ready or stored bytes do not match }
  /api/v1/projects/{id}/files/{b}/preview:
    get:
      summary: Preview a ready blob (SEL-115) - the same bytes, safety headers and AI-access rule as content, plus a content-disposition
      description: |
        Same checks as `files/{b}/content` (file:read, Go gate, a denied file is 403 for every non-human caller; the owner session always reads).
        Always `X-Content-Type-Options: nosniff`; a type outside the short safe list also gets the document sandbox (`Content-Security-Policy: sandbox ...`,
        never `allow-same-origin`) - the one judgement of `document_sandbox.ts`. `Content-Disposition` is `inline` only for `text/plain`, `image/png`
        and `application/pdf`; every other type is `attachment`. The content type is the stored one when it is a plain MIME type, else `application/octet-stream`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BlobId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:read scope, Go policy denied, or the file is closed to AI (ai_access deny) }
        "404": { description: Unknown blob in this project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { description: Blob is not ready or stored bytes do not match }
  /api/v1/projects/{id}/materials:
    post:
      summary: Add a user's own material (SEL-115) - a ready blob becomes a file source object, or a new version of one
      description: |
        Body `{blob_id, title?, object_id?, role?}` (role defaults to `attachment`). Without `object_id` a new material (a `source` object of kind `file`) and
        its first version are made; with `object_id` the blob becomes the next version of that material and the current pointer moves to it.
        The blob has ONE file policy shared by every use: the first attach creates it as `allow` (rev 1); the same bytes uploaded again reuse it, so a
        re-upload never resets a `deny`. Data: `{object_id, version_id, version_no, blob_id, file_policy_id, role, ai_access, original_name, media_type, size, sha256}`;
        `ai_access` is given to a human caller only (an AI caller never gets the key). A caller that is not human who names a blob closed to AI, or a material
        object that carries a closed file, gets the same 404 as for an unknown blob or object, before anything is written. Known limit: `POST uploads` returns
        `blob_id` and `deduplicated: true` for bytes the project already holds, so whoever has the same bytes can learn that the file exists and whether it is
        closed to AI (`GET files/{b}/content` is 403 for a closed file; `POST materials` is 404); no name, policy id or text goes with it. The unit of every
        AI-facing read is the material object: a closed file in any version closes every version of it (a later version inherits the earlier title, the file name).
        Writes through the command `file.upload` (receipt and event `file.material_uploaded`). The same key and body replay the first answer;
        the same key with another body is 409 `idempotency_key_reuse`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blob_id]
              properties:
                blob_id: { type: string }
                title: { type: string, maxLength: 300 }
                object_id: { type: string }
                role: { type: string, enum: [attachment, image, source, rendered, manifest] }
      responses:
        "201":
          description: Material added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Unknown field, bad role or title }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope }
        "404": { description: Unknown blob (or a blob of another project) or unknown object; for a caller that is not human also a blob closed to AI or an object that carries one }
        "409": { description: The blob is not ready, the object is not a material, the object already has this blob in this role, or the key was used for another body (idempotency_key_reuse) }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    get:
      summary: List the user's own materials (SEL-115) - the file of each material's current version
      description: |
        Data `{materials:[{object_id, version_id, version_no, blob_id, file_policy_id, role, title, original_name, media_type, size, sha256, ai_access?, extraction_status, extraction}]}`.
        `extraction_status` is `extracted|partial|unsupported|failed|not_extracted` for the current version's file; `extraction` is `null` or `{extraction_id, status, source_format, extractor, extractor_version, text_blob_id, text_file_policy_id, text_hash, page_count, table_count, warnings, reason, text_ai_access?}` (SEL-116). An AI caller gets `text_*` as `null` when the text is closed (its own policy or its source's); `text_ai_access` is the owner's only.
        The owner session sees every material and each one's `ai_access` (the value in force: `deny` when the policy row or its newest history row says deny).
        Any other caller (agent token, internal AI) gets allowed files only, without the `ai_access` key and with no trace of a closed file - not its name,
        ids, hash or text, and not even a count. The same list is `data.materials` of `GET context`. In `GET context` the `manifest` an AI caller gets leaves out closed
        material objects (the human manifest lists them with `ai_access: deny`); `digest` is computed from the manifest the caller gets, so it differs by audience.
        `GET objects/{o}/versions/{v}` of a closed material is 403 `forbidden` for a caller that is not human (as `GET files/{b}/content`); `GET changes` leaves out
        events whose payload names a closed file (`blob_id` or `file_policy_id`), by file and not by material object: a newer allowed version's upload events still show (`commands/file_access.ts` event_denied; `commands/shared.ts` write_events leaves `object_id` and version columns NULL). The hand-off bundle's `base_versions` leave out closed files and materials.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      security:
        - agentToken: []
        - localSession: []
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing context:read scope or Go policy denied }
        "404": { description: Unknown project }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/file-policies/{fp}/ai-access:
    post:
      summary: Switch whether AI may reference one file (SEL-115) - the owner session only
      description: |
        Body `{ai_access: "allow"|"deny", reason?}`. A change appends one row to the file's history (rev = newest rev + 1) and puts the same value and
        rev on the policy row; nothing is overwritten. Setting the value already in force writes nothing and answers `changed:false`.
        A deny in the policy row or in the newest history row is a deny (the strict side wins). The same blob is one policy, so every material,
        version and role of the same bytes is closed together. Data `{file_policy_id, blob_id, ai_access, rev, changed}`.
        Writes through the command `file.ai_access_set` (receipt and event `file.ai_access_changed`; a no-op leaves the event `file.ai_access_confirmed`).
        This closes the PES API, the MCP tools and the built-in runner; it does not control a local folder a user's own tool reads directly.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: fp
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ai_access]
              properties:
                ai_access: { type: string, enum: [allow, deny] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Done (or unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Bad value, unknown field or bad reason }
        "401": { description: Missing or invalid credential }
        "403": { description: An agent token (whatever its scopes) - the switch is the owner's }
        "404": { description: Unknown file policy in this project }
        "409": { description: The key was used for another body (idempotency_key_reuse) }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/v1/projects/{id}/file-extractions:
    post:
      summary: Pull the text and tables out of one material file (SEL-116) - owner session or a file:write token
      description: |
        Body `{version_id, blob_id}` (the blob must be attached to that version). Reads the stored bytes, extracts, stores the text as a blob of its own and
        records one `file_extractions` row, whatever the outcome. Formats by the original name's extension: `txt` `md` `csv` (UTF-8 only; BOM removed, CRLF/CR become LF;
        another encoding is `failed / invalid_encoding`, the text is never guessed), `docx` `xlsx` `pptx` `hwpx` (zip + XML read with Node built-ins only; paragraphs one per line,
        tables as Markdown pipe tables), and `hwp` `doc` `xls` `ppt` `pdf` or an unknown extension = `unsupported` (no text, no blob, no policy; nothing is made up).
        A damaged file is `failed` (`invalid_container`, `invalid_document`); a file over 32 MiB, or a zip whose parts unpack past 64 MiB in total, is `failed / too_large`
        (the cap is on the real unpacked bytes, never the size in the zip header; no part of the text is returned). One unreadable slide, sheet or section is `partial`
        with a `part_unreadable` warning; the readable parts are kept. One extraction has ONE budget, paid before anything is built: 32 Mi output characters,
        3,000,000 kept elements (cells, rows, paragraphs, text pieces, sheets), 1,000 sheets and 10 s; going over any of them is `failed / too_large`.
        At most 50 warnings are listed; the rest become one `more_warnings` line.
        The whole extraction runs in a worker thread with its own limits (256 MB heap, 15 s): the thread running out of memory is `failed / too_large`, over the time limit
        `failed / extract_timeout`, ending without an answer `failed / extract_error`. A cut-off thread that a native step keeps alive is counted; while one is left a new
        extraction starts no thread and is refused at once with 409 `conflict`, `details.reason: extract_busy`, `retryable: true`. Where worker threads are not allowed
        (Node `--permission` without `--allow-worker`) the same refusal has `details.reason: worker_unavailable`. These two refusals are not answers about the file and
        write nothing (no row, blob, policy, receipt or event). `extract_timeout` and `extract_error` also say something about the moment, not the file: each such attempt is
        recorded (row, receipt, event) but does not answer the next request for the same file - it is tried again (`changed: true`). `too_large`, the damaged-file reasons,
        `extracted`, `partial` and `unsupported` are final. To try again send a NEW Idempotency-Key: the same key replays the first answer (`replayed: true`), also a recorded failure.
        While an extraction runs, the same server answers no other request (usually at most about 16 s per extraction; about 21 s in the rare case the supervisor thread cannot answer).
        Data `{extraction_id, version_id, blob_id, source_file_policy_id, source_format, extractor, extractor_version, status: extracted|partial|unsupported|failed,
        reason, text_blob_id, text_file_policy_id, text_hash, page_count, table_count, warnings:[{code,message}], changed}`.
        The text blob has its OWN policy, created `allow` rev 1 (never inherited from the source). AI reads it only when the source policy AND the text policy both allow
        (strict side wins; `GET files/{text_blob_id}/content|preview` is 403 otherwise, and the list hides the text ids). One blob has one policy, so when the extracted text is
        byte-for-byte the source (a plain UTF-8 txt/md/csv without BOM or CRLF) no second blob exists: `text_blob_id` and `text_file_policy_id` are the source's own.
        Asking again for the same version file and extractor, when the earlier answer is final, writes nothing (no row, blob, policy, receipt or event) and answers the stored result with `changed:false`.
        A caller that is not human who names a closed file gets 403 `forbidden`, before anything is written. Writes through the command `file.extract` (receipt and event `file.extracted`;
        the event carries no text and no file name).
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: [{ agentToken: [] }, { localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_id, blob_id]
              properties:
                version_id: { type: string }
                blob_id: { type: string }
      responses:
        "201":
          description: Extraction recorded (or the stored one, changed:false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { description: Missing or mistyped field, or an unknown field }
        "401": { description: Missing or invalid credential }
        "403": { description: Missing file:write scope, or a caller that is not human names a file closed to AI }
        "404": { description: Unknown version or blob, or a blob not attached to that version }
        "409": { description: "The blob is not ready, or the key was used for another body (idempotency_key_reuse), or the extraction could not start now (conflict with details.reason extract_busy or worker_unavailable, retryable true, nothing written)" }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
