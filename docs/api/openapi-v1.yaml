    post:
      summary: "Reorder a form (SEL-98 U2d): the same questions in a new order, as ONE new set of the form"
      description: "Command question.reorder. Writes a new set (version_no + 1, same stage, round, purpose and form_key) whose members are the old set's questions in the given order, each at its question's current version, in one transaction. No new question, no new question version and no answer is made (an order is not an answer). Only the form's newest set can be reordered (an older one is 409 conflict, details.reason stale_set), and only while its round is open and its edition active (else 409 conflict). question_ids must be a permutation of the set's members (else 422 validation_failed at $.body.question_ids, details.reason not_a_permutation, nothing written). The set's own current order is 422 validation_failed at $.body.question_ids with details.reason no_change (no new set, nothing written). 201 data = { set {id, version_no, form_key}, members [{question_id, version_id, position}] }; the 201 body carries the receipt. Same key and body replays (replayed true, no new set); the same key with another body is 409 idempotency_key_reuse. The owner session, or a token with run:submit."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/QuestionSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
