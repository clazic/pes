        a person may also go back to an older one. rev + 1, refreshed_at = now; scope, attach time and person are kept; the
        source is not written. 200 data = {reference: <row>}. Errors: 404 (unknown reference, or a snapshot that is not the
        source's), 403/404 (the person lost access to the source), 409 conflict (already pinned there, or the original is
