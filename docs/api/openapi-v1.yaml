  /api/v1/projects/{id}/stages/{s}/rounds/{rd}:
    get:
      summary: "One place's form with each question's current version and current answer (SEL-98 U2d). Read-only, no new table"
      description: "{rd} is start (the stage-start questions, round_id null) or a round number (a decimal string of 1 or more). data = { edition (the number of the ACTIVE edition, the same value as the work space read's edition: these paths read the active edition, so a client that shows another edition must not use the data), stage, round_id (the number, null for start), server_round_id (rounds.id of a numbered round; null for start; the round_id a POST P/questions takes), state (current|closed, the same value as the work space), set_id (the newest set of form_key main at that place, null when none was published), form_version (that set's version_no, or null), questions [{ id, version_id (the current version), version_no (decimal string), state, type, text, required, allow_comment_as_answer, importance, help, default_value, options, show_if, merged_into_question_id, display_no, answer }] } in the set's member order. answer is null or { version_id, value, question_version_id, question_version (the version number of the question version it answers, or null), used_default, state, tx_id, receipt_no, committed_at } (the current answer; the three receipt values are those of the write that made it). Number rule of this read: version_no is a decimal string (a Revision, like every version_no); form_version, display_no, round_id and answer.question_version are plain JSON numbers (small counters, not revisions). A place with no form is 200 with set_id null and questions []; an unknown stage, number or place is 404. The owner session, or a token with context:read."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/StageId"
        - $ref: "#/components/parameters/RoundId"
      security: [{ agentToken: [] }, { localSession: [] }]
      responses:
        "200":
          description: Accepted or successful answer
          content:
