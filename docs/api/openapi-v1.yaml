        "404": { description: Unknown project, reference or snapshot }
        "409": { description: Already pinned there, original gone, stale base_rev (rev_conflict), or idempotency key reuse }
        "413": { description: Payload too large (256 KiB JSON limit) }
        "422": { description: A field breaks the rules (validation_failed) }
        "429": { description: Request budget spent; see Retry-After }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
